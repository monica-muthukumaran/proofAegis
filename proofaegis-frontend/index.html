<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Matches --bg in each theme, so the browser chrome on mobile and the
       page ground agree instead of the address bar staying navy over a
       near-white page. -->
  <meta name="theme-color" content="#f7f7f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />

  <title>ProofAegis | Evidence-led exception management</title>
  <meta name="description" content="ProofAegis investigates what failed in accounts payable — and what shouldn't have passed. Cross-case checks a per-invoice system cannot see, every finding traced to a source page." />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="/favicon.svg" color="#4338ca" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="ProofAegis — what passes is scarier than what fails" />
  <meta property="og:description" content="Evidence-led exception management for accounts payable. Every finding traces to a source page you can open." />
  <meta property="og:image" content="/og.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- The type family, hoisted out of styles-color.css.
       It was declared with @import at the top of the THIRD stylesheet, which
       meant the browser could not even discover the font request until the
       whole CSS chain had been fetched and parsed — a guaranteed flash of
       fallback text on every cold load. A <link> here is discoverable in the
       initial HTML scan, and the preconnect opens the socket to the font
       host in parallel rather than after the CSS returns. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

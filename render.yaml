services:
  - type: web
    name: proofaegis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: USE_MOCK_DATA
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      # Add the actual Firebase Hosting URL here before the first live deploy.
      - key: ALLOWED_ORIGINS
        value: https://proofaegis.web.app
      # Every signed-in user gets their own workspace and opens on an empty
      # queue; the seeded corpus stays in demo-workspace and keeps calibrating
      # the reasoning agent for everyone (backend/services/seed_context.py).
      - key: PER_USER_WORKSPACES
        value: "true"
      # MUST equal the frontend's VITE_DEMO_EMAIL. That account is a real
      # Firebase sign-in, so without it here the one-click demo button lands a
      # reviewer in their own empty workspace instead of the seeded one — the
      # single place an empty screen is the wrong answer.
      - key: DEMO_ACCOUNT_EMAILS
        sync: false
      # Render asks for all sync:false values in its Blueprint setup UI.
      # Keep their values out of this repository.
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
